spring:
  application:
    name: sio-backend
  profiles:
    active:
      - dev # Profilo di sviluppo attivo di default

# Configurazione porta del backend
server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      cors:
        allowed-origins:
          - http://localhost:4200
        allowed-methods:
          - GET
