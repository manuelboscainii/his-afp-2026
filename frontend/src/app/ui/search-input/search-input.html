<div class="flex flex-col gap-1.5">
  <label [for]="inputId" class="text-sm font-semibold">
    {{label()}}
  </label>
  <div class="flex items-center gap-2">
    <input
      pInputText
      type="text"
      [id]="inputId"
      [placeholder]="placeholder()"
      [value]="value()"

      (input)="onInput($event)"
      (keydown.enter)="onSearch()"

      class="w-full"
    >
    <p-button
      label="Cerca"
      icon="pi pi-search"
      [disabled]="value().trim().length === 0"
      (onClick)="onSearch()"
    />
  </div>
</div>
